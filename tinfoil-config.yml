cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "waddle"
    image: "ghcr.io/nchapman/waddle@sha256:4a4e8c36d4e62215f6f673702032ad9d62322bd80240ddc05a3f6f4fdc8a1aa6"
    networks: [outbound]
    env:
      - PORT: "8080"
      - NODE_ENV: "production"
      - CONCIERGE_URL: "https://waddle-concierge.ddg-waddle.containers.tinfoil.dev"
      - WADDLE_INSTANCE: "waddle"
      - WADDLE_WAKE_AUTONOMY: "0"   # unattended autonomy is parked — fresh volume per deploy needs the escrow design first
    secrets:
      - CONCIERGE_SHARED_SECRET

networks:
  outbound:
    egress: open   # the agent needs the real web — honest limit, per plan

shim:
  upstream-port: 8080
  paths:
    - /*
